[blocks.math_random_int]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "math"
check = "Number"
fields.FROM = { kind = "inline_value", check = "Number" }
fields.TO = { kind = "inline_value", check = "Number" }

[blocks.mbedColour_picker]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "colour"
check = "Colour"
fields.COLOUR = { kind = "colour", default = "#ff0000" }

# mbedImage_image builds itself out of six right-aligned rows; the single
# `matrix` field stands in for all of them until src/matrix.rs expands it.
[blocks.mbedImage_image]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "image"
check = "Image"
fields.PICTURE = { kind = "matrix" }

[blocks.mbedImage_get_image]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "image"
check = "Image"
fields.IMAGE = { kind = "image" }

[blocks.text_comment]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "statement"
category = "text"
fields.TEXT = { kind = "text" }

# ===== TOOLBOX_VARIABLE ==================================================
# The beginner toolbox declares this category as `custom="VARIABLE"` rather
# than listing static blocks. Blockly creates these two blocks dynamically for
# each variable name, so the renderer deliberately accepts any identifier.
#
# The declaration itself is not in the category at all: it is what the Start
# block's plus-mutator adds, which is why a program that uses a variable has
# to declare it inside `Start` (see `robControls_start.ST`).
[blocks.variables_get]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "variable"
fields.VAR = { kind = "variable", default = "Element" }

[blocks.variables_set]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "statement"
category = "variable"
fields.VAR = { kind = "variable", default = "Element" }
fields.VALUE = { kind = "value" }

# `blocks/variables.js`: `robGlobalVariables_declare` is coloured
# CAT_ACTIVITY_RGB, not the variable violet — it belongs to the Start block it
# lives in. Its name is a `FieldTextInput`, not the `FieldVariable` dropdown
# the getter and setter use, and its minus-mutator deletes the declaration.
#
# `connection` is Blockly's `setPreviousStatement(true, 'declarationGlobal')`:
# it is why a declaration can only sit in the Start block's mouth and an
# action block cannot.
[blocks.robGlobalVariables_declare]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "statement"
category = "activity"
connection = "declarationGlobal"
fields.MUTATOR = { kind = "icon", default = "minus" }
fields.VAR = { kind = "variable_name", default = "Element" }
fields.TYPE = { kind = "dropdown", values = [
  "Number", "Boolean", "String", "Colour", "Image",
  "Array_Number", "Array_Boolean", "Array_String", "Array_Colour", "Array_Image",
] }
# `updateShape_` re-checks the socket every time the type changes, so the
# empty socket always announces the declared type rather than a fixed one.
fields.VALUE = { kind = "value", check_from = "TYPE" }

# ===== TOOLBOX_MATH, the variable part ===================================
# `robMath_change` takes a *socket*, not a variable field: Open Roberta wants
# the getter block plugged in, which is why this reads "erhöhe (Punkte) um 1".
[blocks.robMath_change]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "statement"
category = "math"
fields.VAR = { kind = "inline_value", check = "Number" }
fields.DELTA = { kind = "inline_value", check = "Number" }

# ===== TOOLBOX_LIST ======================================================
# Expert-toolbox blocks, but a beginner meets them the moment the Start
# block's type dropdown offers "Liste Zahl": a declared list needs something
# to put in it. `blocks/lists.js`, the `robLists_*` half of the file.

# `createIt` builds one value input per item: the first carries the title,
# the type dropdown and the arrow, the rest are right-aligned index labels.
# Blockly grows that list with the plus mutator; the catalog offers a fixed
# six, and drops every row that stays empty, which comes to the same thing
# for a printed worksheet. The index labels are spacers: Open Roberta paints
# them, nobody types them.
[blocks.robLists_create_with]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "list"
check_from = "LIST_TYPE"
check_prefix = "Array_"
fields.PLUS = { kind = "icon", default = "plus" }
fields.MINUS = { kind = "icon", default = "minus" }
fields.LIST_TYPE = { kind = "dropdown", values = [
  "Number", "Boolean", "String", "Colour", "Image",
] }
fields.N0 = { kind = "spacer", default = "0" }
fields.ADD0 = { kind = "value", check_from = "LIST_TYPE" }
fields.N1 = { kind = "spacer", default = "1" }
fields.ADD1 = { kind = "value", check_from = "LIST_TYPE", optional = true, align = "right" }
fields.N2 = { kind = "spacer", default = "2" }
fields.ADD2 = { kind = "value", check_from = "LIST_TYPE", optional = true, align = "right" }
fields.N3 = { kind = "spacer", default = "3" }
fields.ADD3 = { kind = "value", check_from = "LIST_TYPE", optional = true, align = "right" }
fields.N4 = { kind = "spacer", default = "4" }
fields.ADD4 = { kind = "value", check_from = "LIST_TYPE", optional = true, align = "right" }
fields.N5 = { kind = "spacer", default = "5" }
fields.ADD5 = { kind = "value", check_from = "LIST_TYPE", optional = true, align = "right" }

# The remaining list blocks all set `inputsInline`, or are given it by
# Blockly's own "dummy input after a value input" rule in `getInputsInline`,
# so every one of them is a single row of sockets and fields.
[blocks.robLists_repeat]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "list"
check_from = "LIST_TYPE"
check_prefix = "Array_"
fields.LIST_TYPE = { kind = "dropdown", values = [
  "Number", "Boolean", "String", "Colour", "Image",
] }
fields.ITEM = { kind = "inline_value", check_from = "LIST_TYPE" }
fields.NUM = { kind = "inline_value", check = "Number" }

# setCheck of six array types, so the socket stays plain: Blockly names a
# type on an empty connection only when there is exactly one to name.
[blocks.robLists_length]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "list"
check = "Number"
fields.VALUE = { kind = "value", check = [
  "Array_Number", "Array_String", "Array_Boolean", "Array_Colour", "Array_Connection", "Array_Image",
] }

[blocks.robLists_isEmpty]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "list"
check = "Boolean"
fields.VALUE = { kind = "inline_value", check = [
  "Array_Number", "Array_String", "Array_Boolean", "Array_Colour", "Array_Connection", "Array_Image",
] }

[blocks.robLists_indexOf]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "list"
check = "Number"
fields.VALUE = { kind = "inline_value", check = [
  "Array_Number", "Array_String", "Array_Boolean", "Array_Colour", "Array_Connection", "Array_Image",
] }
fields.END = { kind = "dropdown" }
fields.FIND = { kind = "inline_value" }

# `updateAt_` hangs the WHERE dropdown on the AT input and moves it into
# place, which is why the index socket follows both menus.
[blocks.robLists_getIndex]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "value"
category = "list"
fields.VALUE = { kind = "inline_value", check = [
  "Array_Number", "Array_String", "Array_Boolean", "Array_Colour", "Array_Connection", "Array_Image",
] }
fields.MODE = { kind = "dropdown" }
fields.WHERE = { kind = "dropdown" }
fields.AT = { kind = "inline_value", check = "Number" }

[blocks.robLists_setIndex]
platforms = ["calliope", "calliopev3", "microbit"]
shape = "statement"
category = "list"
fields.LIST = { kind = "inline_value", check = [
  "Array_Number", "Array_String", "Array_Boolean", "Array_Colour", "Array_Connection", "Array_Image",
] }
fields.MODE = { kind = "dropdown" }
fields.WHERE = { kind = "dropdown" }
fields.AT = { kind = "inline_value", check = "Number" }
fields.TO = { kind = "inline_value" }
