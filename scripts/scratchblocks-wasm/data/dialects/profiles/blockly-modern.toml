# Blockly, current look (thrasos). The default.
# Generated by scripts/blockly-data/generate.py — do not edit by hand.
# thrasos defines no constants of its own: it uses Blockly's base
# ConstantProvider unchanged and differs from geras only in its measure
# pass. It also has no drawer of its own, which is why there is no bevel.

name = "blockly-modern"

[geometry]
notch_width = 15
notch_height = 4
notch_offset = 15
tab_width = 8
tab_height = 15
tab_offset_from_top = 5
corner_radius = 8
row_height = 24
statement_indent = 20
field_height = 16
field_radius = 4
field_padding_x = 5
field_padding_y = 3
padding_small = 3
padding_medium = 5
padding_large = 10
hat_width = 100
hat_height = 15
bevel = false

[colors]
logik = "#5b80a5"
schleifen = "#5ba55b"
mathe = "#5b67a5"
text = "#5ba58c"
listen = "#745ba5"
farben = "#a5745b"
variablen = "#a55b80"
funktionen = "#995ba5"
sonstige = "#8c8c8c"
