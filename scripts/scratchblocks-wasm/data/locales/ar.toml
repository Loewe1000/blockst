# ar locale
#
# Block texts from the Scratch Foundation's official Arabic translation
# (scratch-l10n: editor/blocks/ar.json and editor/extensions/ar.json).
#
# Two adjustments were needed to fit this engine:
#   * Scratch writes the flag/turn icons as ordinary %n placeholders; the
#     engine expects the literal @greenFlag / @turnRight / @turnLeft, so the
#     icon slot is substituted and the remaining %n renumbered.
#   * `dir` tells the renderer to mirror the block layout. It lives in the
#     locale so a new right-to-left language needs no engine change.

dir = "rtl"

